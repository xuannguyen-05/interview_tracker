services:
  backend:
    image: xnguyen05/interview-tracker-backend:latest
    container_name: interview-backend
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "7070:7070"
    env_file:
      - ./backend/.env.docker
    networks:
      - interview-network
    depends_on:
      - db

  # frontend:
  #   build: ./frontend
  #   container_name: interview-frontend
  #   ports:
  #     - "5173:5173"
  #   env_file:
  #     - ./frontend/.env
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - interview-network

  db:
    image: postgres:17
    container_name: interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview-network

networks:
  interview-network:

volumes:
  postgres_data:
